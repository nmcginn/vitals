name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - run: make check

  # Darwin code only compiles here (decision 5): cgo against the macOS SDK on arm64.
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      # -count=1: the darwin tests check the live OS, which Go's test cache can't
      # see, so a restored cache would report a pass without running them.
      - env: { CGO_ENABLED: '1', GOFLAGS: '-count=1' }
        run: make check
      # Builds every package with cgo, test-only ones included.
      - env: { CGO_ENABLED: '1' }
        run: go build ./...
