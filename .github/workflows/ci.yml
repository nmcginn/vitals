name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - run: make check

  # Darwin code only compiles here (decision 5): cgo against the macOS SDK on arm64.
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - env: { CGO_ENABLED: '1' }
        run: make check
